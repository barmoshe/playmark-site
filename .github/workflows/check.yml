name: check
# Vercel deploys this repo on its own (production from main, a preview per pull request).
# This workflow is the gate in front of it: broken asset links and copy-rule slips fail here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Links, copy rules, metadata
        run: node scripts/check.mjs
      - name: HTML validates
        run: npx --yes html-validate@9 index.html
